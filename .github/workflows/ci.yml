name: CI

on:
  pull_request:
    branches:
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.astro
          key: static

      - run: exit 1
      - run: npm ci
      - run: npm run check

      - uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          filter_mode: nofilter

      - run: npm run format:core:check
      ## TODO: content formatting checks
      - run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4192"
          RUN_LINK_CHECK: true

      - run: npm run check:worker

      - name: Dump GitHub context
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID=$(gh run view ${{ github.run_id }} --json jobs --jq '.jobs[] | select (.name == "Compiles") | .databaseId')
          BODY="CI failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/$JOB_ID"
          echo -e "$BODY"

      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules/.astro
          key: static

      - name: Check - Validate redirects (infinite loops, sources with fragment)
        run: npx tsm bin/validate-redirects.ts

      - name: Tests
        run: npm run test
